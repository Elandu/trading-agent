[project]
name = "trading-agent"
version = "0.1.0"
description = "Token-conscious Jev trading-agent research harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typesafe-sdk>=0.7.0",
]

[project.scripts]
trading-agent = "trading_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
